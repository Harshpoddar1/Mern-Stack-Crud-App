name: MERN DevsecOps CI

on:
  push:
    branches:
       - master

jobs:
  dependency-audit:  #----------jobs name.
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout to runner
        uses: actions/checkout@v5
      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Packages install
        run:  npm ci
      - name: Backend audit
        run:  npm audit --omit=dev --audit-level=high
      - name: Client packages install  #----------client.
        working-directory: client
        run:  npm ci --legacy-peer-deps
      - name: client audit
        working-directory: client
        continue-on-error: true
        run:  npm audit --omit=dev --audit-level=high

  build-and-scan:  # ----------New jobs name
    needs: dependency-audit
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout to runner
        uses: actions/checkout@v5
      - name: Backend build and check  # ----------backend
        run:  docker build -t mern-backend:ci .
      - name: Trivy scan backend - visibility
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mern-backend:ci
          severity:  'CRITICAL,HIGH'
          exit-code: '0'
      - name: Trivy scan backend - gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mern-backend:ci
          severity:  'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
      - name: Client build and check  # ----------client
        run:  docker build -t mern-client:ci ./client
      - name: Trivy scan client - visibility
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mern-client:ci
          severity:  'CRITICAL,HIGH'
          exit-code: '0'
      - name: Trivy scan client - gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mern-client:ci
          severity:  'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
  deploy:
    needs: build-and-scan
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            if [ ! -d Mern-Stack-Crud-App ]; then  # ------------ if aggar !(not) -d(directory) Mern-Stack-Crud-App nhi hoga too hi clone chalega.
              git clone https://github.com/Harshpoddar1/Mern-Stack-Crud-App.git
            fi
            cd Mern-Stack-Crud-App
            git pull origin master
            cat > .env << EOF
            MONGO_URI=${{ secrets.MONGO_URI }}
            EOF
            docker compose up --build -d
