services:
  mern-backend:
    build: ./
    expose:
      - "5000"
    environment:
      - MONGO_URI=${MONGO_URI}
    depends_on:
      - mongo-db

  mongo-db:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db

  mern-client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - mern-backend

  uptime_kuma:
    image: louislam/uptime-kuma:1
    ports:
      - "3001:3001"
    volumes:
      - utk_data:/app/data
    restart: unless-stopped

volumes:
  mongo-data:
  utk_data:

